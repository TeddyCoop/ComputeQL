# GDB_STATE_ARENA_RESERVE_SIZE: 2gb
# GDB_STATE_ARENA_COMMIT_SIZE: 32mb

# GDB_DATABASE_ARENA_RESERVE_SIZE: 64kb
# GDB_DATABASE_ARENA_COMMIT_SIZE: 4kb

# GDB_TABLE_ARENA_RESERVE_SIZE: 1mb
# GDB_TABLE_ARENA_COMMIT_SIZE: 32kb
# GDB_TABLE_EXPAND_FACTOR: 2.0

# GDB_COLUMN_EXPAND_COUNT: 64
# GDB_COLUMN_ARENA_RESERVE_SIZE: 256mb
# GDB_COLUMN_ARENA_COMMIT_SIZE: 32mb
# GDB_COLUMN_VARIABLE_CAPACITY_ALLOC_SIZE: 4kb
# GDB_COLUMN_MAX_GROW_BY_SIZE: 32mb

# GDB_DISK_BACKED_THRESHOLD_SIZE: 64mb

# GDB_DICT_ENCODE_MIN_ROWS: 4096  # below this row count, dont bother dictionary encoding a string column
# GDB_DICT_ENCODE_MAX_DISTINCT: 65536  # cap on distinct values for a column to still count as low cardinality
# GDB_DICT_ENCODE_MAX_CARDINALITY_RATIO: 0.5  # distinct_count / row_count must be <= this to dictionary encode

# GDB_ZONEMAP_CHUNK_ROWS: 8192  # must be a power of two

# GDB_VULKAN_VALIDATION: false

# GPU_MAX_BUFFER_SIZE: 64mb

# GPU_VULKAN_MAX_CACHED_KERNELS: 16  # can only be raised above the default, not lowered
# GPU_VULKAN_MAX_POOLED_BUFFERS: 128
# GPU_VULKAN_POOLED_BUFFER_HASH_SLOTS: 256  # must be a power of two
# GPU_BATCH_MAX_PENDING_READS: 8  # can only be raised above the default, not lowered
# GPU_VULKAN_MEM_BLOCK_SIZE: 1mb
# GPU_VULKAN_MAX_MEM_BLOCKS: 64

# QE_BYTECODE_MAX_WORDS: 4096
# QE_MAX_NUMERIC_CONSTS: 256
# QE_STRING_CONST_POOL_SIZE: 64kb
# QE_SCAN_OUTPUT_DEFAULT_CAP_ROWS: 65536
# QE_AGG_ROWS_PER_CHUNK: 4096
# QE_INDEX_SCAN_MAX_AND_LEAVES: 16
# APP_THREAD_POOL_WORKER_COUNT: 2  # 0 = auto-detect from logical processor count