# GDB_STATE_ARENA_RESERVE_SIZE: 2gb
# GDB_STATE_ARENA_COMMIT_SIZE: 32mb

# GDB_DATABASE_ARENA_RESERVE_SIZE: 64kb
# GDB_DATABASE_ARENA_COMMIT_SIZE: 4kb

# GDB_TABLE_ARENA_RESERVE_SIZE: 1mb
# GDB_TABLE_ARENA_COMMIT_SIZE: 32kb
# GDB_TABLE_EXPAND_FACTOR: 2.0

# GDB_COLUMN_EXPAND_COUNT: 64
# GDB_COLUMN_ARENA_RESERVE_SIZE: 256mb
# GDB_COLUMN_ARENA_COMMIT_SIZE: 32mb
# GDB_COLUMN_VARIABLE_CAPACITY_ALLOC_SIZE: 4kb
# GDB_COLUMN_MAX_GROW_BY_SIZE: 32mb

# GDB_DISK_BACKED_THRESHOLD_SIZE: 64mb

# GDB_DICT_ENCODE_MIN_ROWS: 4096  # below this row count, dont bother dictionary encoding a string column
# GDB_DICT_ENCODE_MAX_DISTINCT: 65536  # cap on distinct values for a column to still count as low cardinality
# GDB_DICT_ENCODE_MAX_CARDINALITY_RATIO: 0.5  # distinct_count / row_count must be <= this to dictionary encode

# GDB_ZONEMAP_CHUNK_ROWS: 8192  # must be a power of two

# GDB_VULKAN_VALIDATION: false

# GPU_MAX_BUFFER_SIZE: 64mb

# GPU_VULKAN_MAX_CACHED_KERNELS: 16  # can only be raised above the default, not lowered
# GPU_VULKAN_MAX_POOLED_BUFFERS: 128
# GPU_VULKAN_POOLED_BUFFER_HASH_SLOTS: 256  # must be a power of two
# GPU_BATCH_MAX_PENDING_READS: 8  # can only be raised above the default, not lowered
# GPU_VULKAN_MEM_BLOCK_SIZE: 1mb
# GPU_VULKAN_MAX_MEM_BLOCKS: 64

# QE_BYTECODE_MAX_WORDS: 4096
# QE_MAX_NUMERIC_CONSTS: 256
# QE_STRING_CONST_POOL_SIZE: 64kb
# QE_SCAN_OUTPUT_DEFAULT_CAP_ROWS: 65536
# QE_AGG_ROWS_PER_CHUNK: 4096
# QE_INDEX_SCAN_MAX_AND_LEAVES: 16
# APP_THREAD_POOL_WORKER_COUNT: 2  # 0 = auto-detect from logical processor count

# QE_OPTIMIZER: true         # master switch for every optimizer rule below
# QE_OPT_PUSHDOWN: true      # predicate pushdown, constant folding, contradictions, constant propagation
# QE_OPT_INLINE: true        # drop unused CTEs, inline single-use CTEs and derived tables
# QE_OPT_SCAN_COST: true     # choose index, CPU, GPU or identity scans by estimated cost
# QE_OPT_REORDER_MAX_ROWS: 4000000  # CPU scans over larger tables keep the written condition order

# cost model, microseconds. defaults come from bench_calibrate on a 12 worker machine
# QE_COST_GPU_SUBMIT_US: 140
# QE_COST_GPU_SCAN_PER_ROW_US: 0.0006
# QE_COST_GPU_UPLOAD_FIXED_US: 100
# QE_COST_GPU_UPLOAD_PER_ROW_US: 0.0009
# QE_COST_CPU_SCAN_FIXED_US: 28
# QE_COST_CPU_SCAN_PER_ROW_US: 0.0215
# QE_COST_CPU_SCAN_PER_EXTRA_CONDITION_US: 0.0078
# QE_COST_CPU_REFERENCE_WORKERS: 12  # worker count the CPU numbers were measured with
# QE_COST_INDEX_FIXED_US: 2
# QE_COST_INDEX_PER_MATCH_US: 0.0013
# QE_COST_FILTER_PER_ROW_US: 0.115
# QE_COST_FILL_PER_ROW_US: 0.001
# QE_OPT_JOIN_ORDER: true    # reorder inner joins by estimated cost, left joins and what follows them stay put
# QE_OPT_STATS_MAX_ROWS: 4000000  # a column over this size only gets estimates from statistics that already exist
# QE_COST_JOIN_BUILD_PER_ROW_US: 0.0049
# QE_COST_JOIN_PROBE_PER_ROW_US: 0.0045
# QE_COST_JOIN_OUTPUT_PER_ROW_US: 0.0045
# QE_OPT_SIZING: true          # size the join output buffer and the group by hash table from the row estimates
# QE_OPT_SMALL_CPU: true       # sort and aggregate on the CPU when the input is too small to pay for GPU round trips
# QE_OPT_TOP_N: true           # ORDER BY with LIMIT keeps only the first rows instead of sorting everything
# QE_OPT_TOP_N_MAX_K: 4096     # offset plus limit past this stays a full sort
# QE_OPT_SORT_ELIMINATION: true  # skip a sort when an index scan already returns rows in that order
# QE_COST_SORT_CPU_PER_ROW_LOG_US: 0.0095
# QE_COST_SORT_GPU_FIXED_US: 1100
# QE_COST_SORT_GPU_PER_ROW_US: 0.11
# QE_COST_TOP_N_PER_ROW_US: 0.012
# QE_COST_AGGREGATE_CPU_PER_ROW_US: 0.075
# QE_COST_AGGREGATE_GPU_FIXED_US: 700
# QE_COST_AGGREGATE_GPU_PER_ROW_US: 0.008
# QE_OPT_SEMI_JOIN: true      # EXISTS with an equality to the outer table, and IN over a long subquery result, run as semi and anti joins
# QE_OPT_FUSE: true           # stages with no CPU work between them share one GPU submit (needs shaders/prefix_sum.spv, built with COMPILE_SHADERS=1)
# QE_SCAN_SPECULATIVE_ROWS: 4096  # rows of a GPU scan's output copied back in the same submit as its count
